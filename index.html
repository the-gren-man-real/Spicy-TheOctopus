<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spicy the Octopus</title>
<style>
  body {
    background:#0d1117;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding-top:20px;
  }

  h1 {
    font-size:32px;
    margin-bottom:10px;
  }

  /* BIG BUTTONS */
  button {
    background:#22c55e;
    color:#0d1117;
    border:none;
    padding:20px 32px;
    font-size:22px;
    border-radius:18px;
    cursor:pointer;
    margin:10px;
    font-weight:bold;
    transition:0.15s;
  }
  button:hover { transform:scale(1.08); background:#4ade80; }
  button:active { transform:scale(0.95); }

  /* SPICY AREA */
  #spicy-container {
    width:350px;
    height:350px;
    margin:0 auto 20px auto;
    position:relative;
    background:#1e293b;
    border-radius:30px;
    box-shadow:0 0 40px rgba(0,0,0,0.5);
    overflow:hidden;
  }

  /* SPICY BODY */
  #spicy {
    width:200px;
    height:200px;
    background:#111827;
    border-radius:50%;
    position:absolute;
    top:75px;
    left:75px;
    box-shadow:
      inset -10px -10px 25px rgba(0,0,0,0.6),
      inset 10px 10px 25px rgba(255,255,255,0.08),
      0 0 40px rgba(0,0,0,0.4);
    animation:breathing 3s ease-in-out infinite;
    transition:background 0.4s, transform 0.4s;
  }

  @keyframes breathing {
    0% { transform:scale(1); }
    50% { transform:scale(1.04); }
    100% { transform:scale(1); }
  }

  /* Tentacles */
  .tentacle {
    width:70px;
    height:70px;
    background:#111827;
    border-radius:50%;
    position:absolute;
    box-shadow:inset -6px -6px 12px rgba(0,0,0,0.5),
               inset 6px 6px 12px rgba(255,255,255,0.05);
    animation:wiggle 2.5s infinite ease-in-out;
  }

  @keyframes wiggle {
    0% { transform:rotate(0deg); }
    50% { transform:rotate(6deg); }
    100% { transform:rotate(0deg); }
  }

  .t1 { bottom:-20px; left:20px; }
  .t2 { bottom:-20px; right:20px; }
  .t3 { bottom:10px; left:-20px; }
  .t4 { bottom:10px; right:-20px; }

  /* Eyes */
  .eye {
    width:40px;
    height:40px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:60px;
    box-shadow:0 0 10px rgba(255,255,255,0.4);
  }
  .eye.left { left:50px; }
  .eye.right { right:50px; }

  .pupil {
    width:16px;
    height:16px;
    background:black;
    border-radius:50%;
    position:absolute;
    top:12px;
    left:12px;
    transition:transform 0.2s;
  }

  .shine {
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:6px;
    left:6px;
    opacity:0.8;
  }

  /* Mouth */
  #mouth {
    width:70px;
    height:40px;
    position:absolute;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    border-radius:0 0 50px 50px;
    border-bottom:6px solid white;
    transition:0.3s;
  }

  .happy { border-bottom-color:white; border-top:none; }
  .sad { border-bottom:none; border-top:6px solid white; border-radius:50px 50px 0 0; }
  .angry { border-bottom:none; border-top:6px solid #ef4444; border-radius:50px 50px 0 0; }
  .neutral { border-bottom:6px solid white; height:0; }

  /* Hunger bar */
  #hunger-wrapper {
    width:350px;
    height:22px;
    background:#1f2937;
    border-radius:999px;
    margin:0 auto 20px auto;
    overflow:hidden;
    border:2px solid #334155;
  }
  #hunger-bar {
    height:100%;
    width:100%;
    background:#22c55e;
    transition:width 0.3s, background 0.3s;
  }

  /* DRAGGABLE FOOD + TOY */
  .draggable {
    position:absolute;
    font-size:48px;
    cursor:grab;
    user-select:none;
  }
</style>
</head>
<body>

<h1>Spicy the Octopus</h1>

<div id="spicy-container">
  <div id="spicy">
    <div class="tentacle t1"></div>
    <div class="tentacle t2"></div>
    <div class="tentacle t3"></div>
    <div class="tentacle t4"></div>

    <div class="eye left">
      <div class="pupil"></div>
      <div class="shine"></div>
    </div>

    <div class="eye right">
      <div class="pupil"></div>
      <div class="shine"></div>
    </div>

    <div id="mouth" class="happy"></div>
  </div>

  <!-- Food + Toy spawn here -->
  <div id="food" class="draggable" style="display:none;">🍤</div>
  <div id="toy" class="draggable" style="display:none;">🎾</div>
</div>

<div id="hunger-wrapper">
  <div id="hunger-bar"></div>
</div>

<div style="font-size:20px; margin-bottom:20px;">
  Emotion: <span id="emotion-text">Happy</span><br>
  Hunger: <span id="hunger-text">0 / 100</span>
</div>

<button onclick="spawnFood()">Feed</button>
<button onclick="spawnToy()">Play</button>

<script>
  const state = { hunger:0, emotion:'happy' };

  const hungerText = document.getElementById('hunger-text');
  const hungerBar = document.getElementById('hunger-bar');
  const emotionText = document.getElementById('emotion-text');
  const spicy = document.getElementById('spicy');
  const mouth = document.getElementById('mouth');
  const pupils = document.querySelectorAll('.pupil');

  const foodEl = document.getElementById('food');
  const toyEl = document.getElementById('toy');

  const foodEmojis = ["🦀","🦐","🦞","🐚","🐌","🐠","🐟"];

  function updateUI() {
    hungerText.textContent = state.hunger + " / 100";
    hungerBar.style.width = (100 - state.hunger) + "%";

    if (state.hunger < 40) hungerBar.style.background = "#22c55e";
    else if (state.hunger < 70) hungerBar.style.background = "#eab308";
    else hungerBar.style.background = "#ef4444";

    emotionText.textContent = state.emotion.charAt(0).toUpperCase() + state.emotion.slice(1);

    mouth.className = state.emotion;

    let color = "#111827";
    if (state.emotion === "happy") color = "#0f172a";
    if (state.emotion === "sad") color = "#1e293b";
    if (state.emotion === "angry") color = "#450a0a";

    spicy.style.background = color;

    let x = 0, y = 0;
    if (state.emotion === "happy") y = -2;
    if (state.emotion === "sad") y = 3;
    if (state.emotion === "angry") x = 3;

    pupils.forEach(p => p.style.transform = `translate(${x}px, ${y}px)`);
  }

  /* DRAGGING SYSTEM */
  function makeDraggable(el, onDrop) {
    let offsetX = 0, offsetY = 0, dragging = false;

    el.addEventListener("mousedown", start);
    el.addEventListener("touchstart", start);

    function start(e) {
      dragging = true;
      const rect = el.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      offsetX = cx - rect.left;
      offsetY = cy - rect.top;

      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", stop);
      document.addEventListener("touchmove", move);
      document.addEventListener("touchend", stop);
    }

    function move(e) {
      if (!dragging) return;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;

      el.style.left = (cx - offsetX - spicy.getBoundingClientRect().left + 75) + "px";
      el.style.top = (cy - offsetY - spicy.getBoundingClientRect().top + 75) + "px";
    }

    function stop() {
      dragging = false;
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", stop);
      document.removeEventListener("touchmove", move);
      document.removeEventListener("touchend", stop);
      onDrop();
    }
  }

  /* FEEDING */
  function spawnFood() {
    const emoji = foodEmojis[Math.floor(Math.random()*foodEmojis.length)];
    foodEl.textContent = emoji;
    foodEl.style.display = "block";
    foodEl.style.left = "140px";
    foodEl.style.top = "260px";
  }

  makeDraggable(foodEl, () => {
    const foodRect = foodEl.getBoundingClientRect();
    const mouthRect = mouth.getBoundingClientRect();

    const overlap = !(foodRect.right < mouthRect.left ||
                      foodRect.left > mouthRect.right ||
                      foodRect.bottom < mouthRect.top ||
                      foodRect.top > mouthRect.bottom);

    if (overlap) {
      state.hunger -= 25;
      if (state.hunger < 0) state.hunger = 0;
      state.emotion = "happy";
      foodEl.style.display = "none";
      updateUI();
    }
  });

  /* PLAYING */
  function spawnToy() {
    toyEl.style.display = "block";
    toyEl.style.left = "40px";
    toyEl.style.top = "40px";
  }

  makeDraggable(toyEl, () => {
    const toyRect = toyEl.getBoundingClientRect();
    const spicyRect = spicy.getBoundingClientRect();

    const overlap = !(toyRect.right < spicyRect.left ||
                      toyRect.left > spicyRect.right ||
                      toyRect.bottom < spicyRect.top ||
                      toyRect.top > spicyRect.bottom);

    if (overlap) {
      state.hunger += 10;
      if (state.hunger > 100) state.hunger = 100;
      state.emotion = state.hunger > 70 ? "sad" : "happy";
      toyEl.style.display = "none";
      updateUI();
    }
  });

  /* AUTO HUNGER */
  setInterval(() => {
    state.hunger += 3;
    if (state.hunger > 100) state.hunger = 100;

    if (state.hunger > 80) state.emotion = "sad";
    else if (state.hunger > 50) state.emotion = "neutral";

    updateUI();
  }, 4000);

  updateUI();
</script>

</body>
</html>
